name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make test
      - run: make build

      - name: Build Docker image
        run: docker build --tag proofpitch-ai:ci .
      - name: Run offline container smoke test
        run: |
          docker run --detach --name proofpitch-ci -p 3000:3000 proofpitch-ai:ci
          trap 'docker logs proofpitch-ci; docker rm -f proofpitch-ci' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          exit 1
