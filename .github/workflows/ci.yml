name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: make test
      - run: make build

      - name: Build Docker image
        run: docker build --tag proofpitch-ai:ci .
      - name: Run complete tests in offline container
        run: docker run --rm --network none proofpitch-ai:ci npm test
      - name: Run offline container smoke test
        run: |
          docker run --detach --network none --name proofpitch-ci proofpitch-ai:ci
          trap 'docker logs proofpitch-ci; docker rm -f proofpitch-ci' EXIT
          for attempt in {1..20}; do
            if docker exec proofpitch-ci node -e "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); return r.text(); }).then(console.log).catch(() => process.exit(1))"; then exit 0; fi
            sleep 1
          done
          exit 1
